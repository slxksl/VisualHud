name: Build mod
on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Arrange files
        run: |
          C=src/main/java/net/brsk/hudmenu/client
          M=src/main/java/net/brsk/hudmenu/mixin
          R=src/main/resources
          F=src/main/resources/assets/hudmenu/font
          mkdir -p $C $M $R $F
          for f in HudAddScreen IconData Icons Shapes Theme UiFont; do
            if [ -f $f.java ]; then cp $f.java $C/; fi
          done
          if [ -f ChatScreenMixin.java ]; then cp ChatScreenMixin.java $M/; fi
          if [ -f fabric.mod.json ]; then cp fabric.mod.json $R/; fi
          if [ -f hudmenu.mixins.json ]; then cp hudmenu.mixins.json $R/; fi
          if [ -f inter.ttf ]; then cp inter.ttf $F/; fi
          rm -f $F/inter.otf
          printf '%s\n' '{' '  "providers": [' '    {' '      "type": "ttf",' '      "file": "hudmenu:inter.ttf",' '      "shift": [0.0, 0.0],' '      "size": 10.0,' '      "oversample": 6.0' '    }' '  ]' '}' > $F/ui.json
          find src -type f | sort
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: current
      - name: Build
        run: gradle build --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: hudmenu-jar
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar
